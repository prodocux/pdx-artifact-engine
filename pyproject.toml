[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdx-artifact-engine"
version = "0.2.0a1"
description = "Model-optional deterministic artifact orchestration framework for PDX skills"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[project.scripts]
pdx-validate = "pdx_artifact_engine.cli.validate:main"
pdx-run = "pdx_artifact_engine.cli.run:main"

[tool.setuptools.packages.find]
where = ["runtime", "packages/pdx_artifact_core/src", "adapters/prodocux"]
include = ["pdx_artifact_engine*", "pdx_artifact_core*", "pdx_adapter_prodocux*"]

[tool.setuptools.package-data]
pdx_artifact_core = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["runtime", "packages/pdx_artifact_core/src", "adapters/prodocux"]
