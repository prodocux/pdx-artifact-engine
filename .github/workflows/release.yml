name: Publish release assets to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing coordinated GitHub Release tag to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      publish_media: ${{ steps.media.outputs.publish_media }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification tools
        run: python -m pip install --upgrade build twine
      - name: Test release source
        run: |
          cd release-source
          python -m pip install -e ".[dev]"
          pytest
          python scripts/verify_clean_install.py
          cd ..
          ruff check scripts/verify_release_assets.py
      - name: Download approved coordinated release assets
        run: |
          mkdir release-dist
          gh release download "$RELEASE_TAG" --dir release-dist \
            --pattern "pdx_artifact_engine-*.whl" \
            --pattern "pdx_artifact_engine-*.tar.gz"
          gh release download "$RELEASE_TAG" --dir release-dist \
            --pattern "pdx_adapter_media-*.whl" \
            --pattern "pdx_adapter_media-*.tar.gz" || true
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
      - name: Verify metadata and GitHub SHA-256 digests
        run: |
          python -m twine check release-dist/*
          python scripts/verify_release_assets.py --tag "$RELEASE_TAG" --dist release-dist --release-json release.json --source release-source
      - name: Stage engine distributions
        run: |
          mkdir pypi-engine
          cp release-dist/pdx_artifact_engine-* pypi-engine/
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-engine-${{ env.RELEASE_TAG }}
          path: pypi-engine/
          if-no-files-found: error
          retention-days: 7
      - name: Stage media distributions
        id: media
        run: |
          if compgen -G "release-dist/pdx_adapter_media-*" > /dev/null; then
            mkdir pypi-media
            cp release-dist/pdx_adapter_media-* pypi-media/
            echo "publish_media=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_media=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.media.outputs.publish_media == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pypi-media-${{ env.RELEASE_TAG }}
          path: pypi-media/
          if-no-files-found: error
          retention-days: 7

  publish-engine:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-engine-${{ github.event.release.tag_name || inputs.tag }}
          path: dist
      - name: Publish unchanged engine distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Wait for the published Engine version on PyPI
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${RELEASE_TAG#v}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "https://pypi.org/pypi/pdx-artifact-engine/${version}/json" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "PyPI did not expose pdx-artifact-engine ${version} after 300 seconds" >&2
          exit 1

  publish-media:
    if: needs.verify.outputs.publish_media == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi-media
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-media-${{ github.event.release.tag_name || inputs.tag }}
          path: dist
      - name: Publish unchanged media distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  update-readme:
    needs: publish-engine
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Update verified PyPI status
        run: |
          version="${RELEASE_TAG#v}"
          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          python scripts/update_readme_after_publish.py \
            --version "$version" \
            --tag "$RELEASE_TAG" \
            --commit "$release_commit"
      - name: Open README-only publication PR
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: README.md
          branch: automation/pypi-readme-${{ env.RELEASE_TAG }}
          commit-message: "docs(readme): mark ${{ env.RELEASE_TAG }} as published"
          title: "docs(readme): mark ${{ env.RELEASE_TAG }} as published"
          body: |
            PyPI has exposed this version through its JSON API.

            This automated PR updates only the README verified-release block.
          delete-branch: true
