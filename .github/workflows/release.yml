name: Publish release assets to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing coordinated GitHub Release tag to promote
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install verification tools
        run: python -m pip install --upgrade build twine
      - name: Test release source
        run: |
          cd release-source
          python -m pip install -e ".[dev]"
          pytest
          python scripts/verify_clean_install.py
          cd ..
          ruff check scripts/verify_release_assets.py
      - name: Download approved coordinated release assets
        run: |
          mkdir release-dist
          gh release download "$RELEASE_TAG" --dir release-dist \
            --pattern "pdx_artifact_engine-*.whl" \
            --pattern "pdx_artifact_engine-*.tar.gz" \
            --pattern "pdx_adapter_media-*.whl" \
            --pattern "pdx_adapter_media-*.tar.gz"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release.json
      - name: Verify metadata and GitHub SHA-256 digests
        run: |
          python -m twine check release-dist/*
          python scripts/verify_release_assets.py --tag "$RELEASE_TAG" --dist release-dist --release-json release.json --source release-source
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions-${{ env.RELEASE_TAG }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions-${{ github.event.release.tag_name || inputs.tag }}
          path: dist
      - name: Publish unchanged distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
